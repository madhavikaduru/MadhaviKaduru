<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>SCM WOS Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login">
    <div class="login-card">
        <div class="brand">
            SCM <span>WOS</span>
            <small>Western Offshore Assets</small>
        </div>

        <h2>Create New User</h2>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="text" user_name="user_name" placeholder="username" required>
            <!-- Changed name from 'username' to 'cpf_no' to match your backend -->
            <input type="text" name="user_id" placeholder="CPF No" required>
            
            <select name="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="Admin">Admin</option>
                <option value="HPO">HPO</option>
                <option value="DO">Dealing Officer</option>
                <option value="Indentor">Indentor</option>
            </select>
            
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            
            <button type="submit" class="login-card button">Register</button>
        </form>

        <p class="muted">Already have an account?</p>
        <!-- Updated to use url_for('auth.login') -->
        <a href="{{ url_for('auth.login') }}">🔑 Sign In click here</a>
    </div>
</body>
</html>
