{% extends "base.html" %}{% block heading %}Contract / Order Status{% endblock %}
{% block content %}<section class="panel"><h3>Add Contract / PO</h3><form id="contractForm" class="formgrid">
<label>Indent No<input name="indent_no" type="number" required></label><label>Supplier Name<input name="supplier_name" required></label><label>Vendor Code<input name="vendor_code"></label>
<label>Contract No.<input name="contract_no"></label><label>PO No.<input name="po_no"></label><label>Contract Value<input name="contract_value" type="number" step="0.01"></label>
<label>Award Date<input name="award_date" type="date"></label><label>Delivery Date<input name="delivery_date" type="date"></label>
<label>Delivery Status<select name="delivery_status">{% for x in ['Yet to Start','Under Execution','Partially Completed','Completed','Delayed'] %}<option>{{x}}</option>{% endfor %}</select></label>
<label>Payment Status<select name="payment_status">{% for x in ['Invoice to be Submitted','Invoice Submitted','Under Finance Processing','Payment Released','Pending','Not Applicable'] %}<option>{{x}}</option>{% endfor %}</select></label>
<div class="wide"><button class="btn primary">Save Contract</button></div></form><div id="contractMsg"></div></section>
<section class="panel tablewrap"><h3>Contract Ageing</h3><table id="contractTable"><thead><tr><th>Indent</th><th>PO</th><th>Supplier</th><th>Value</th><th>Delivery Date</th><th>Delivery</th><th>Payment</th></tr></thead><tbody></tbody></table></section>{% endblock %}
{% block scripts %}<script>
loadContracts();document.getElementById('contractForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/contracts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.getElementById('contractMsg').innerHTML=r.ok?'<div class="alert success">Contract saved.</div>':'<div class="alert danger">Failed.</div>';if(r.ok){e.target.reset();loadContracts();}}
</script>{% endblock %}
