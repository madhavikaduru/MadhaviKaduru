<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Integrated Indent Tracking System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login">
   <div>
       <div class="login-card">
       <div class="brand">
        Integrated Indent Tracking System
        <span></span>
        <small>Western Offshore Assets</small>
      </div>
     
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
            {% for category, message in messages %}
              <div class="alert alert-{{ category if category != 'message' else 'info' }}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <h2>Secure Sign In</h2>
      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="text" name="user_id" placeholder="CPF No" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="button">Sign In</button>
      </form>

      <h2>New User Registration</h2>
      <a href="{{ url_for('auth.register') if 'auth.register' in endpoints else '/register' }}">👤 Registration click here</a>
    </div>
  </div>
</body>
</html>
